<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Greenhouse Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/mqtt@5.0.0/dist/mqtt.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌿 Smart Greenhouse Control</h1>
            <div class="status-bar">
                <div id="connectionStatus">
                    <span class="dot"></span>
                    <span id="statusText">Connecting...</span>
                </div>
                <div id="timestamp"></div>
            </div>
        </header>

        <div class="grid">
            <!-- Temperature Card -->
            <div class="card">
                <div class="card-header">
                    <span>🌡️</span>
                    <h3>Temperature</h3>
                </div>
                <div class="card-value">
                    <span id="temperature">--</span>
                    <span>°C</span>
                </div>
                <div class="setpoint-info">
                    <div><span>Min:</span> <span id="tempMin">--</span>°C</div>
                    <div><span>Max:</span> <span id="tempMax">--</span>°C</div>
                </div>
                <div class="progress-bar">
                    <div id="tempBar" class="progress-fill"></div>
                </div>
                <div id="tempStatus" class="status-text">Loading...</div>
            </div>

            <!-- Soil Moisture Card -->
            <div class="card">
                <div class="card-header">
                    <span>💧</span>
                    <h3>Soil Moisture</h3>
                </div>
                <div class="card-value">
                    <span id="soilAvg">--</span>
                    <span>%</span>
                </div>
                <div class="setpoint-info">
                    <div><span>Min:</span> <span id="soilMin">--</span>%</div>
                    <div><span>Max:</span> <span id="soilMax">--</span>%</div>
                </div>
                <div class="progress-bar">
                    <div id="soilBar" class="progress-fill"></div>
                </div>
                <div id="soilStatus" class="status-text">Loading...</div>
            </div>

            <!-- Individual Sensors -->
            <div class="card">
                <div class="card-header">
                    <span>🪴</span>
                    <h3>Individual Sensors</h3>
                </div>
                <div class="sensors-grid">
                    <div class="sensor-item">
                        <label>Sensor 1</label>
                        <span id="soil1" class="sensor-value">--</span>
                        <span id="soil1Status" class="sensor-status"></span>
                    </div>
                    <div class="sensor-item">
                        <label>Sensor 2</label>
                        <span id="soil2" class="sensor-value">--</span>
                        <span id="soil2Status" class="sensor-status"></span>
                    </div>
                    <div class="sensor-item">
                        <label>Sensor 3</label>
                        <span id="soil3" class="sensor-value">--</span>
                        <span id="soil3Status" class="sensor-status"></span>
                    </div>
                </div>
            </div>

            <!-- Mode & Controls -->
            <div class="card">
                <div class="card-header">
                    <span>🎮</span>
                    <h3>Control</h3>
                </div>
                <div class="mode-buttons">
                    <button id="autoBtn" class="mode-btn active" onclick="setMode(true)">🤖 AUTO</button>
                    <button id="manualBtn" class="mode-btn" onclick="setMode(false)">👆 MANUAL</button>
                </div>
                <div class="actuators">
                    <div class="actuator">
                        <span>💡 UV Light</span>
                        <button id="uvBtn" class="ctrl-btn off" onclick="toggleActuator('uv')">OFF</button>
                    </div>
                    <div class="actuator">
                        <span>🚰 Water Pump</span>
                        <button id="pumpBtn" class="ctrl-btn off" onclick="toggleActuator('pump')">OFF</button>
                    </div>
                    <div class="actuator">
                        <span>🌀 Cooling Fan</span>
                        <button id="fanBtn" class="ctrl-btn off" onclick="toggleActuator('fan')">OFF</button>
                    </div>
                </div>
                <div class="mode-info">Mode: <span id="modeText">AUTOMATIC</span></div>
            </div>

            <!-- Charts -->
            <div class="card full-width">
                <div class="card-header">
                    <span>📊</span>
                    <h3>Historical Data</h3>
                </div>
                <div class="charts">
                    <div class="chart-wrapper"><canvas id="tempChart"></canvas></div>
                    <div class="chart-wrapper"><canvas id="soilChart"></canvas></div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
